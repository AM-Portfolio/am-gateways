# Local amctl identity — NEW GHCR package for am-gateways monorepo
# Does not use am-asrax-proxy (legacy) or am-api-gateway (owned by am-auth).
name: am-gateways-api
release: am-gateways-api
image: ghcr.io/am-portfolio/am-gateways-api
runtime: python
language: python
dockerfile: Dockerfile
context: .
github:
  repo: AM-Portfolio/am-gateways
  deploy_workflow: api-gateway-deploy.yml
  service: am-gateways-api
  ref: main
deploy:
  via: actions
  rebuild: on-change
