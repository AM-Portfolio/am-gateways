# Local amctl identity — am-api-gateway (folder: api-gateway)
# Legacy am-asrax-proxy stays on its own repo/deploy and is not replaced.
name: am-api-gateway
release: am-api-gateway
image: ghcr.io/am-portfolio/am-api-gateway
runtime: python
language: python
dockerfile: Dockerfile
context: .
github:
  repo: AM-Portfolio/am-gateways
  deploy_workflow: api-gateway-deploy.yml
  service: am-api-gateway
  ref: main
deploy:
  via: actions
  rebuild: on-change
