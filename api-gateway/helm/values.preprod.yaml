# am-asrax-proxy — Preprod Environment Overrides
# Vault paths verified against vps_vault_full_backup_20260602_005102.json

environment: preprod
replicaCount: 2

service:
  port: 8080

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

probes:
  port: 8080
  startup:
    path: "/health"
    failureThreshold: 30
    periodSeconds: 10
  liveness:
    path: "/health"
  readiness:
    path: "/health"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-preprod-global-cors@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /am
          pathType: Prefix
        - path: /v1/diagnostics
          pathType: Prefix
        - path: /subscriptions
          pathType: Prefix


# ── Non-secret env vars ───────────────────────────────────────────────────────
env:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "preprod"

  # Redis DB index for gateway
  REDIS_DB: "3"

  # ALLOWED_ORIGINS also exists in Vault preprod path — Vault value takes precedence.
  # This is a fallback only.
  ALLOWED_ORIGINS: "http://localhost:3000,https://am.asrax.in"

# ── Vault secret paths (verified from backup) ─────────────────────────────────
vault:
  enabled: true
  secretPaths:
    proxy:
      path: "apps/data/preprod/services/am-asrax-proxy"
    identity:
      path: "apps/data/preprod/services/am-identity"
    redis:
      path: "apps/data/preprod/infra/redis"
