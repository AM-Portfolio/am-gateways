# Manual Contabo Argo deploy — waits until app is Healthy/Synced or FAILS the job.
# Prod/DR: does not auto-deploy (opens promote PR and exits failed so status is not green).
name: Manual Deploy — AM API Gateway

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR tag (leave empty = use current preprod pin from am-gitops)"
        required: false
        type: string
        default: ""
      environment:
        description: "Target Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - preprod
          - prod
          - dr

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    name: Contabo Argo → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout am-pipelines scripts
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          path: am-pipelines-repo
          ref: main
          token: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          TAG_IN: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          SVC=am-api-gateway
          TAG="$TAG_IN"
          if [[ -z "$TAG" ]]; then
            RAW=$(gh api "repos/AM-Portfolio/am-gitops/contents/preprod/image-tags/${SVC}.yaml" -H "Accept: application/vnd.github.raw")
            TAG=$(echo "$RAW" | sed -n 's/.*tag:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
            echo "Resolved tag from preprod pin: ${TAG}"
          fi
          if [[ -z "$TAG" ]]; then
            echo "::error::No image tag — pass image_tag or ensure preprod pin exists"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Deploy + verify Contabo (dev/preprod)
        if: inputs.environment == 'dev' || inputs.environment == 'preprod'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          INPUT_SERVICE_NAME: am-api-gateway
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x am-pipelines-repo/scripts/ci/argo-api-lib.sh
          chmod +x am-pipelines-repo/scripts/ci/argo-pin-and-wait.sh
          am-pipelines-repo/scripts/ci/argo-pin-and-wait.sh

      - name: Prod/DR require promote (do not mark deploy success)
        if: inputs.environment == 'prod' || inputs.environment == 'dr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          SVC=am-api-gateway
          if [[ "$ENV" == "prod" ]]; then
            gh workflow run promote-to-prod.yml -R AM-Portfolio/am-gitops -f service="$SVC"
          else
            gh workflow run promote-to-dr.yml -R AM-Portfolio/am-gitops -f service="$SVC"
          fi
          echo "::error::Promote PR opened for ${SVC} ${ENV}. Manual Deploy does not auto-merge or verify prod/DR."
          echo "::error::Human-merge the promote PR, then Contabo argo-sync-on-tags deploys. Re-check Argo UI."
          exit 1
