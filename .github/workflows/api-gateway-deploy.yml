# Manual Contabo Argo deploy (no Helm / no kubeconfig).
# Prefer: Actions → "API Gateway Publish" → Run workflow → deploy_env.
# This workflow pins an existing GHCR tag (or opens a promote PR).
name: Manual Deploy — AM API Gateway

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR tag (leave empty = use current preprod pin from am-gitops)"
        required: false
        type: string
        default: ""
      environment:
        description: "Target Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - preprod
          - prod
          - dr

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    name: Contabo Argo → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag + pin/promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          TAG_IN: ${{ inputs.image_tag }}
          ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          SVC=am-api-gateway
          TAG="$TAG_IN"
          if [[ -z "$TAG" ]]; then
            RAW=$(gh api "repos/AM-Portfolio/am-gitops/contents/preprod/image-tags/${SVC}.yaml" -H "Accept: application/vnd.github.raw")
            TAG=$(echo "$RAW" | sed -n 's/.*tag:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
            echo "Resolved tag from preprod pin: ${TAG}"
          fi
          if [[ -z "$TAG" ]]; then
            echo "::error::No image tag — pass image_tag or ensure preprod pin exists"
            exit 1
          fi
          case "$ENV" in
            dev|preprod)
              gh workflow run set-image-tag.yml -R AM-Portfolio/am-gitops \
                -f service="$SVC" -f env="$ENV" -f tag="$TAG"
              echo "::notice::OK Contabo will sync ${SVC}-${ENV} to tag=${TAG}"
              ;;
            prod)
              gh workflow run promote-to-prod.yml -R AM-Portfolio/am-gitops -f service="$SVC"
              echo "::notice::Promote PR opened — human-merge for Contabo prod sync"
              ;;
            dr)
              gh workflow run promote-to-dr.yml -R AM-Portfolio/am-gitops -f service="$SVC"
              echo "::notice::Promote-to-dr opened — human-merge for Contabo DR sync"
              ;;
          esac
