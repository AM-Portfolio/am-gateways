# Slim Contabo graph: Build once; Auto sync preprod on main only; Contabo Approve matrix.
# No Feature GHCR notice, no GitOps pin, no Contabo-central.
name: API Gateway Publish

on:
  push:
    branches: ["main", "develop", "fix/**", "hotfix/**", "feature/**", "feat/**"]
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway-publish.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway-publish.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish AM API Gateway
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish-contabo.yml@main
    with:
      language: "python"
      working_directory: "api-gateway"
      image_name: "am-api-gateway"
      pipelines_ref: "main"
      build_context: "."
    secrets: inherit
