# Publish: one Build in central. Contabo Approve siblings after Build.
# Graph: Auto sync→preprod (no gitops commit) | Contabo dev | Feature→GHCR | Contabo preprod (+prod/dr on main).
# No GitOps pin job for gateways — pin on Contabo Approve only.
name: API Gateway Publish

on:
  push:
    branches: ["main", "develop", "fix/**", "hotfix/**", "feature/**", "feat/**"]
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway-publish.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway-publish.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish AM API Gateway
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish.yml@main
    with:
      language: "python"
      working_directory: "api-gateway"
      image_name: "am-api-gateway"
      build_context: "."
      preprod_namespace: "am-apps-preprod"
      prod_namespace: "am-apps-prod"
      deploy_prod: false
      deploy_dev: false
      deploy_preprod: true
      gitops_write_preprod: false
      gitops_values_path: "api-gateway"
      contabo_wait_preprod: false
      contabo_approve: true
    secrets: inherit
