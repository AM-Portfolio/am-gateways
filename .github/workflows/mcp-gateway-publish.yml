# Publish: security + build + GHCR + preprod pin (central).
# main Contabo (parallel): preprod auto; dev/prod/dr wait for GitHub Environment Approve.
name: AI Gateway Publish

on:
  push:
    branches: ["main", "develop", "fix/**", "hotfix/**", "feature/**"]
    paths:
      - "mcp-gateway/**"
      - ".github/workflows/mcp-gateway-publish.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "mcp-gateway/**"
      - ".github/workflows/mcp-gateway-publish.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish AM AI Gateway
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish.yml@main
    with:
      language: "python"
      working_directory: "mcp-gateway"
      image_name: "am-ai-gateway"
      build_context: "."
      preprod_namespace: "am-apps-preprod"
      prod_namespace: "am-apps-prod"
      deploy_prod: false
      deploy_dev: false
      deploy_preprod: true
      gitops_write_preprod: true
      gitops_values_path: "mcp-gateway"
      contabo_wait_preprod: false
    secrets: inherit

  contabo-preprod:
    name: Contabo Argo → preprod
    needs: publish
    if: |
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.publish.result != 'cancelled' &&
      needs.publish.outputs.image_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout am-pipelines scripts
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          path: am-pipelines-repo
          ref: main
          token: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Sync + wait Contabo Healthy
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          INPUT_SERVICE_NAME: am-ai-gateway
          INPUT_ENVIRONMENT: preprod
          INPUT_IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
        run: |
          set -euo pipefail
          sleep 5
          chmod +x am-pipelines-repo/scripts/ci/argo-api-lib.sh
          chmod +x am-pipelines-repo/scripts/ci/argo-sync-and-wait.sh
          am-pipelines-repo/scripts/ci/argo-sync-and-wait.sh

  contabo-approve:
    name: Contabo Argo → ${{ matrix.env }} (approve)
    needs: publish
    if: |
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.publish.result != 'cancelled' &&
      needs.publish.outputs.image_tag != ''
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod, dr]
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout am-pipelines scripts
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          path: am-pipelines-repo
          ref: main
          token: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        env:
          TAG_FROM_PUBLISH: ${{ needs.publish.outputs.image_tag }}
        run: |
          set -euo pipefail
          TAG="${TAG_FROM_PUBLISH:-}"
          if [[ -z "$TAG" ]]; then
            echo "::error::No image tag from publish"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Deploy + verify Contabo (dev)
        if: matrix.env == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          INPUT_SERVICE_NAME: am-ai-gateway
          INPUT_ENVIRONMENT: ${{ matrix.env }}
          INPUT_IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x am-pipelines-repo/scripts/ci/argo-api-lib.sh
          chmod +x am-pipelines-repo/scripts/ci/argo-pin-and-wait.sh
          am-pipelines-repo/scripts/ci/argo-pin-and-wait.sh

      - name: Promote + verify Contabo (prod/dr)
        if: matrix.env == 'prod' || matrix.env == 'dr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          INPUT_SERVICE_NAME: am-ai-gateway
          INPUT_ENVIRONMENT: ${{ matrix.env }}
          INPUT_IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x am-pipelines-repo/scripts/ci/argo-api-lib.sh
          chmod +x am-pipelines-repo/scripts/ci/argo-promote-and-wait.sh
          am-pipelines-repo/scripts/ci/argo-promote-and-wait.sh
