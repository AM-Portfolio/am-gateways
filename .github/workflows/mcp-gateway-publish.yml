name: AI Gateway Publish

on:
  push:
    branches: ["main", "develop", "fix/**", "hotfix/**", "feature/**"]
    paths:
      - "mcp-gateway/**"
      - ".github/workflows/mcp-gateway-publish.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "mcp-gateway/**"
      - ".github/workflows/mcp-gateway-publish.yml"
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "After build, Contabo Argo deploy to this env (none = pin preprod on main only)"
        required: true
        type: choice
        default: none
        options:
          - none
          - dev
          - preprod
          - prod
          - dr

jobs:
  publish:
    name: Publish AM AI Gateway
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish.yml@main
    with:
      language: "python"
      working_directory: "mcp-gateway"
      image_name: "am-ai-gateway"
      build_context: "."
      preprod_namespace: "am-apps-preprod"
      prod_namespace: "am-apps-prod"
      deploy_prod: false
      deploy_preprod: true
      gitops_write_preprod: true
      gitops_values_path: "mcp-gateway"
    secrets: inherit

  # Contabo Argo: pin + sync + wait Healthy/Synced (or fail). Prod/DR = promote PR only (exit failed).
  argo-deploy:
    name: Contabo Argo → ${{ github.event.inputs.deploy_env || 'none' }}
    needs: publish
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deploy_env != 'none' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout am-pipelines scripts
        if: github.event.inputs.deploy_env == 'dev' || github.event.inputs.deploy_env == 'preprod'
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          path: am-pipelines-repo
          ref: main
          token: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Deploy + verify Contabo (dev/preprod)
        if: github.event.inputs.deploy_env == 'dev' || github.event.inputs.deploy_env == 'preprod'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          INPUT_SERVICE_NAME: am-ai-gateway
          INPUT_ENVIRONMENT: ${{ github.event.inputs.deploy_env }}
          INPUT_IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${INPUT_IMAGE_TAG:-}" ]]; then
            echo "::error::No image_tag from publish job"
            exit 1
          fi
          chmod +x am-pipelines-repo/scripts/ci/argo-api-lib.sh
          chmod +x am-pipelines-repo/scripts/ci/argo-pin-and-wait.sh
          am-pipelines-repo/scripts/ci/argo-pin-and-wait.sh

      - name: Prod/DR require promote (do not mark deploy success)
        if: github.event.inputs.deploy_env == 'prod' || github.event.inputs.deploy_env == 'dr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          ENV: ${{ github.event.inputs.deploy_env }}
        run: |
          set -euo pipefail
          SVC=am-ai-gateway
          if [[ "$ENV" == "prod" ]]; then
            gh workflow run promote-to-prod.yml -R AM-Portfolio/am-gitops -f service="$SVC"
          else
            gh workflow run promote-to-dr.yml -R AM-Portfolio/am-gitops -f service="$SVC"
          fi
          echo "::error::Promote PR opened for ${SVC} ${ENV}. Publish does not auto-merge or verify prod/DR."
          exit 1
